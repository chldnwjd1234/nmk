<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="./asset/favicon.ico" type="image/x-icon">
    <title>NATIONAL MUSEUM OF KOREA</title>
    <style>
        html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* ✅ 배경 이미지에만 blur 적용 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url(./asset/img/pad_bg.png) no-repeat center center, #c0c0c0;
            background-size: cover;
            filter: blur(3px);
            /* ✅ blur 강도 조절 (5px ~ 15px) */
            z-index: -1;
            /* ✅ 다른 요소들 뒤로 */
        }

        /* 버튼 영역 */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: fixed;
            left: 100px;
            top: 100px;
            z-index: 10;
            /* ✅ 배경보다 앞에 */
        }



        button {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            background: #B3332C;
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.3s;
        }

        button.active {
            background: #B3332C;
        }

        /* 디바이스 프레임 */
        .device {
            position: relative;
            border: 8px solid #333;
            border-radius: 40px;
            overflow: hidden;
            background: black;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
            touch-action: none;
            z-index: 1;
            /* ✅ 배경보다 앞에 */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 32px;
            background: #fff;
        }

        /* 디바이스 사이즈 */
        .iphone {
            width: 414px;
            height: 896px;
        }

        .ipad {
            width: 1024px;
            height: 1366px;
        }
    </style>
</head>

<body>

    <div class="toolbar">
        <button id="btnIphone" class="active"> iPhone XR</button>
    </div>

    <div class="device iphone" id="device">
        <iframe id="frame" src="index.html"></iframe>
    </div>

    <script>
        const device = document.getElementById('device');
        const btnIphone = document.getElementById('btnIphone');
        // 💡 디바이스 전환 버튼
        btnIphone.addEventListener('click', () => {
            btnIphone.classList.add('active');
            btnIpad.classList.remove('active');
            device.classList.add('iphone');
        });
        btnIpad.addEventListener('click', () => {
            btnIpad.classList.add('active');
            btnIphone.classList.remove('active');
            device.classList.remove('iphone');
        });
    </script>

</body>

</html>
